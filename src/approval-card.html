<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#172014;color:#e4efdc;font:14px/1.6 system-ui,sans-serif;padding:24px}header{display:flex;justify-content:space-between;align-items:center;color:#abc39b;font-size:11px;margin-bottom:20px}.brand{font-size:22px;color:#e0eed6;font-weight:600}h1{font-size:22px;letter-spacing:-.6px;line-height:1.2;margin:0 0 10px}p{margin:0;color:#a9bf98}#title{font-size:15px;color:#d7e7cc;margin-top:18px;font-weight:600}pre{font:12px/1.8 system-ui;white-space:pre-wrap;overflow-wrap:anywhere;background:#111b0e;border:1px solid #364d2b;padding:16px;border-radius:5px;max-height:220px;overflow:auto}label{display:block;font-size:12px;margin:15px 0 6px}select{width:100%;padding:10px;background:#21341a;color:#dbebd0;border:1px solid #4a6938;border-radius:4px}button{font:13px system-ui;cursor:pointer;border:0;border-radius:4px;padding:12px 16px;background:#074ee8;color:white}button.secondary{background:#2b3c22;color:#c6dcb7;border:1px solid #4b633c}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}#status{margin-top:15px;font-size:12px}.foot{font-size:10px;color:#829c71;margin-top:18px}button:focus-visible,select:focus-visible{outline:2px solid #bfdcaa;outline-offset:3px}#error{color:#ffc4a7}[hidden]{display:none!important}</style></head><body><header><span class="brand">✳ lattice</span><span>YOUR METHOD. YOUR CALL.</span></header><h1>Is this the ideal way to do it?</h1><p>Save this method to your account. Share it only with the team you choose.</p><div id="content" hidden><p id="title"></p><p id="author"></p><pre id="method"></pre><label for="team">Who can borrow it?</label><select id="team"><option value="">Just me — save to my account</option></select><div class="actions"><button id="approve">Yes, save this skill ↗</button><button class="secondary" id="later">Not yet</button><button class="secondary" id="review">Open in Lattice ↗</button></div></div><p id="status" role="status" aria-live="polite">Loading the captured method…</p><p class="foot">The draft stays private until you approve it.</p><script>/* APP_SCRIPT */</script></body></html>
